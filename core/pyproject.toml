[project]
name = "plotlines-core"
version = "0.0.1"
description = "Plotlines routing core — pure Python library (P1: no fastapi import). See ARCH §6."
requires-python = ">=3.11"
dependencies = [
    # Geospatial stack. Enabled for SPIKE-00 (frozen sidecar packaging) — this is the
    # heavy native dependency tree the freeze has to survive (ARCH §4, risk A5).
    "osmnx>=2.0",
    "shapely>=2.0",
    "rasterio>=1.3",
    "numpy>=1.26",
    "networkx>=3.0",
    # PMTiles archive reading/writing for the basemap tile service (FR92-94,
    # issue #154). Pure Python, no native extension — confirmed to survive
    # the PyInstaller freeze in packaging/build_sidecar.sh.
    "pmtiles>=3.7,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plotlines_core"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
