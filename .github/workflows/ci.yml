# CI — lint gates plus the full test suites.
#
# The P1 boundary gate (ARCH §6.1, §14.5, risk A7) is the load-bearing one:
# `plotlines-core` may never import `fastapi`. That's the whole reason the
# core/service split exists, so it runs on every push and PR, before there's
# any toolchain to set up.
#
# The reveal-gate and payload-schema gates sit alongside it. The three test
# jobs below (core / service / client) run the real suites — 867 + 123 + 1154
# tests — as independent jobs so a failure points at one layer. Build, freeze,
# and Flutter desktop-bundle jobs are still out of scope until later milestones.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  p1-boundary-lint:
    name: "P1 boundary: core must not import fastapi"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if core/ imports fastapi
        run: |
          if grep -rnE '^\s*(import fastapi|from fastapi)' core/plotlines_core/; then
            echo "::error::plotlines-core imported fastapi — this violates P1 (ARCH §6.1, risk A7). core/ must stay a pure library."
            exit 1
          fi
          echo "OK: no fastapi import found in core/plotlines_core/"

  reveal-gate-lint:
    name: "reveal gate: no role content in Presentation, no authored text in a template"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two gates, one script (ARCH §15.3, §15.5; punch list §6A.1; FR145 / M14).
      # The first keeps `Role.content` out of Presentation. The second is the
      # one the byte assertions on the export path structurally cannot make
      # (ARCH A30): a sentence composed in Presentation is downstream of them,
      # so the enforcement has to be that no template accepts authored text as
      # a slot value in the first place. Same shape as the fastapi gate above
      # — grep, no toolchain, runs before any Flutter job exists.
      - run: tools/ci/reveal_gate_lint.sh

  payload-schema:
    name: "trip payload schema (SPIKE-20)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      # Validates the committed fixture payloads against the committed schema and
      # checks that every FR-map pointer still resolves. Deliberately the light half of
      # the spike: no graph fixtures, no Dart, no network — the full round trip is
      # `spikes/SPIKE-20/run.py` and needs both. What this catches is the drift that
      # actually happens between runs, a schema edit that no longer describes the
      # payload the core emits (ARCH D28).
      - run: PYTHONPATH=core python spikes/SPIKE-20/run.py --check-committed

  core-tests:
    name: "core tests (867)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Pure-library suite (ARCH §6). The dependency tree is the heavy native
      # geo stack — osmnx / shapely / rasterio / pyogrio — so the uv cache above
      # is what keeps this job off the critical path. Python version comes from
      # core/pyproject.toml (requires-python >=3.11); uv provisions it.
      - run: uv sync --frozen
        working-directory: core
      - run: uv run --frozen pytest
        working-directory: core

  service-tests:
    name: "service tests (123)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # FastAPI wrapper contract + lifecycle (ARCH §14.2). service/uv.lock pulls
      # plotlines-core as an editable path dep (../core), so the single-repo
      # checkout above is enough for `uv sync` to resolve it.
      - run: uv sync --frozen
        working-directory: service
      - run: uv run --frozen pytest
        working-directory: service

  client-tests:
    name: "client tests (1154)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.5"
      # Flutter widget/unit suite. Runs on the Dart VM (no device, no display),
      # so plain `flutter test` is all that's needed. Version pinned to the
      # toolchain client/ currently targets (Dart SDK ^3.12.2).
      - run: flutter pub get
        working-directory: client
      - run: flutter test
        working-directory: client
