# CI — lint gates plus the full test suites.
#
# The P1 boundary gate (ARCH §6.1, §14.5, risk A7) is the load-bearing one:
# `plotlines-core` may never import `fastapi`. That's the whole reason the
# core/service split exists, so it runs on every push and PR, before there's
# any toolchain to set up.
#
# The reveal-gate and payload-schema gates sit alongside it. The three test
# jobs below (core / service / client) run the real suites as independent jobs
# so a failure points at one layer. Build, freeze, and Flutter desktop-bundle
# jobs are still out of scope until later milestones.
#
# The job names used to carry test counts. They are gone deliberately (#235 C):
# nobody updates a number in a job name, so it drifts within a PR or two and
# then reads as an assertion the repo is quietly failing — the labels claimed
# 867 / 123 / 1154 against actual counts of 890 / 147 / 1234. The suites report
# their own totals in the log, which cannot go stale.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  p1-boundary-lint:
    name: "P1 boundary: core must not import fastapi"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if core/ imports fastapi
        run: |
          if grep -rnE '^\s*(import fastapi|from fastapi)' core/plotlines_core/; then
            echo "::error::plotlines-core imported fastapi — this violates P1 (ARCH §6.1, risk A7). core/ must stay a pure library."
            exit 1
          fi
          echo "OK: no fastapi import found in core/plotlines_core/"

  reveal-gate-lint:
    name: "reveal gate: no role content in Presentation, no authored text in a template"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Two gates, one script (ARCH §15.3, §15.5; punch list §6A.1; FR145 / M14).
      # The first keeps `Role.content` out of Presentation. The second is the
      # one the byte assertions on the export path structurally cannot make
      # (ARCH A30): a sentence composed in Presentation is downstream of them,
      # so the enforcement has to be that no template accepts authored text as
      # a slot value in the first place. Same shape as the fastapi gate above
      # — grep, no toolchain, runs before any Flutter job exists.
      - run: tools/ci/reveal_gate_lint.sh

  payload-schema:
    name: "trip payload schema (SPIKE-20)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      # Validates the committed fixture payloads against the committed schema, checks
      # that every FR-map pointer still resolves, and checks that core's SCHEMA_VERSION
      # and the client's tripSchemaVersion name the same schema (#346). Deliberately the
      # light half of the spike: no graph fixtures, no Dart, no network — the full round
      # trip is `spikes/SPIKE-20/run.py` and needs both. What this catches is the drift
      # that actually happens between runs: a schema edit that no longer describes the
      # payload the core emits, or one producer bumped without the other (ARCH D28).
      - run: PYTHONPATH=core python spikes/SPIKE-20/run.py --check-committed

  sidecar-bundled-data-lint:
    name: "sidecar packaging: core data files must be bundled (#509)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A `Path(__file__)`-relative config read (this codebase's pattern for
      # package-local data, e.g. curation/defaults.py) only resolves in a
      # frozen sidecar if packaging/build_sidecar.sh actually bundles it —
      # every test suite below runs against source, never a frozen artifact,
      # so this is the only thing that would have caught #509 (every /layers
      # call 500ing because layer_defaults.json was never collected).
      - run: tools/ci/sidecar_bundled_data_lint.sh

  core-tests:
    name: "core tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Pure-library suite (ARCH §6). The dependency tree is the heavy native
      # geo stack — osmnx / shapely / rasterio / pyogrio — so the uv cache above
      # is what keeps this job off the critical path. Python version comes from
      # core/pyproject.toml (requires-python >=3.11); uv provisions it.
      - run: uv sync --frozen
        working-directory: core
      - run: uv run --frozen pytest
        working-directory: core

  service-tests:
    name: "service tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # FastAPI wrapper contract + lifecycle (ARCH §14.2). service/uv.lock pulls
      # plotlines-core as an editable path dep (../core), so the single-repo
      # checkout above is enough for `uv sync` to resolve it.
      - run: uv sync --frozen
        working-directory: service
      # `-n auto` (pytest-xdist, one worker per runner vCPU): the suite is
      # CPU-bound on route solves against the Boulder fixture and shares no
      # state between tests — every fixture is `tmp_path`-scoped and the CLI
      # tests stub `uvicorn.Server`. Measured 80 s single-process on this
      # runner; the conftest restores the root logger and joins worker pools
      # after every test precisely so that order no longer matters.
      - run: uv run --frozen pytest -n auto
        working-directory: service

  client-tests:
    # The critical-path job. Before sharding, `flutter test` alone took ~200 s
    # on the 4-vCPU runner, and the SDK download another ~55 s in front of
    # it, so the whole workflow's wall time was this job's. The cost is not in
    # the tests — two thirds of them finish inside 50 ms — it's ~800 s of CPU
    # split roughly 60/40 between per-file compile/isolate spawn and test
    # bodies, and that divides cleanly by *file* (not by test — see the
    # script for why `--total-shards` is the wrong tool). Four file-level
    # shards, each on its own runner, with the SDK cached across runs.
    #
    # Shard count is a matrix constant, not a test count (#235 C): adding
    # files rebalances the shards on its own, and nothing here has to be
    # updated when the suite grows. Any one shard is a real `flutter test`
    # run, so a failure still points at a file.
    name: "client tests (shard ${{ matrix.shard }} of 4)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.5"
          cache: true
      # Flutter widget/unit suite. Runs on the Dart VM (no device, no display),
      # so plain `flutter test` is all that's needed. Version pinned to the
      # toolchain client/ currently targets (Dart SDK ^3.12.2).
      - run: flutter pub get
        working-directory: client
      - run: tools/ci/client_test_shard.sh ${{ matrix.shard }} 4

  client-tests-gate:
    # The name the branch ruleset pins as a required check. Sharding split the
    # one "client tests" check into four matrix checks, so the context the
    # ruleset waits on stopped being reported and every PR sat on an expected
    # check that could never arrive. This job restores that one fixed name
    # without re-coupling it to the shard count (#235 C): it runs no tests,
    # it only reports whether every shard passed, so changing the matrix
    # never means editing the ruleset.
    #
    # `if: always()` matters — without it a failed shard leaves this job
    # skipped, and a skipped required check is never satisfied either.
    name: "client tests"
    runs-on: ubuntu-latest
    needs: client-tests
    if: always()
    steps:
      - name: Fail unless every client shard passed
        run: |
          result='${{ needs.client-tests.result }}'
          echo "client shards: $result"
          test "$result" = success
