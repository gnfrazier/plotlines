[project]
name = "plotlines-service"
version = "0.0.1"
description = "Plotlines FastAPI wrapper — sidecar mode now, hosted mode later. See ARCH §7."
requires-python = ">=3.11"
dependencies = [
    "plotlines-core",
    "fastapi",
    "uvicorn",
    # Issue #262 (epic #264 Phase 1.8, review §6.7, addendum L1) added
    # pyosmium behind the `mirror-clip` extra, specifically kept out of
    # `packaging/build_sidecar.sh`'s frozen sidecar until SPIKE-J (#266,
    # 2026-09-15) measured whether it would survive that freeze — it does,
    # PARITY on all four client targets at +3.4-4.5 MB (well inside A5's
    # budget). Issue #275 (Phase 3.3) is what gives the sidecar something
    # that imports it: `mirror_clip.py` always did, and now
    # `plotlines_core.graph.pbf_source` / `plotlines_core.curation.providers`
    # do too (declared again there, since `core` is what actually imports
    # `osmium`, not `service`) — so this is a base dependency, not an extra,
    # and `packaging/build_sidecar.sh` collects it like every other native
    # dependency in `COLLECT_DATA`/`COLLECT_SUBMODULES`/`COPY_METADATA`.
    # BSD-2-Clause, never the GPL-3 `osmium` CLI (addendum L1) —
    # `packaging/check_no_gpl.py` (promoted from `spikes/SPIKE-J/`) asserts
    # that mechanically as part of every freeze.
    "osmium>=4.3,<5",
]

[project.scripts]
# Same entrypoint the frozen binary exposes, so a source run and a frozen run are
# invoked identically (ARCH §7.3's spawn contract).
plotlines-sidecar = "plotlines_service.__main__:main"

[tool.uv.sources]
plotlines-core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    # `-n auto` in CI and `tools/test_all.sh`. Every test here is `tmp_path`-
    # scoped and nothing binds a real socket (`test_sidecar_entrypoint.py`
    # stubs `uvicorn.Server`), so workers do not share state; the suite is
    # CPU-bound on the route solves and splits cleanly.
    "pytest-xdist>=3.6",
]

[tool.hatch.build.targets.wheel]
packages = ["plotlines_service"]
