[project]
name = "plotlines-service"
version = "0.0.1"
description = "Plotlines FastAPI wrapper — sidecar mode now, hosted mode later. See ARCH §7."
requires-python = ">=3.11"
dependencies = [
    "plotlines-core",
    "fastapi",
]

[tool.uv.sources]
plotlines-core = { path = "../core" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plotlines_service"]
