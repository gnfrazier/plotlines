name: spike20_roundtrip
description: >-
  SPIKE-20's Dart half — the trip payload deserialized into ARCH §9.1's domain
  classes, stored in and read back from a drift `trip.payload` column (ARCH §10.3).
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.6.0

dependencies:
  drift: ^2.28.0
  sqlite3: ^2.9.0
  path: ^1.9.0

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.28.0
  lints: ^5.0.0
