name: plotlines_ui
description: The Plotlines design system for Flutter — Material 3 themed to brand, adaptive across Android, iOS, web, and desktop.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
    # Variable fonts: one file, weight declared per named instance so Flutter
    # picks the right static instance instead of interpolating at runtime.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Variable.ttf
          weight: 500
        - asset: assets/fonts/Archivo-Variable.ttf
          weight: 700
        - asset: assets/fonts/Archivo-Variable.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 500
