<!-- @dsCard group="Brand" viewport="700x230" name="Trip card (TripCard)" subtitle="The signature saved-trip object" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--canvas);color:var(--text-primary);padding:22px;display:flex;justify-content:center}
.card{width:340px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.thumb{height:84px;background:repeating-linear-gradient(135deg,var(--panel) 0 9px,var(--canvas) 9px 18px);position:relative}
.badge{position:absolute;top:10px;right:10px;font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.06em;background:var(--spruce);color:#fff;padding:4px 8px;border-radius:3px}
.body{padding:16px}.t{font-weight:700;font-size:17px}
.stats{display:flex;gap:8px;margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--ink-2);flex-wrap:wrap}
.stats .m{color:var(--spruce)}</style></head><body>
<div class="card"><div class="thumb"><span class="badge">OFFLINE READY</span></div>
<div class="body"><div class="t">Cascade Loop · 4 days</div><div class="stats"><span>178 MI</span><span>·</span><span>↑ 9,400 FT</span><span>·</span><span class="m">GRAVEL+PADDLE</span></div></div></div>
</body></html>
