<!-- @dsCard group="Colors" viewport="700x150" name="Mode accents" subtitle="Land, water, caution, hazard" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--paper);color:var(--text-primary);padding:20px;display:flex;gap:12px}
.sw{flex:1;border-radius:var(--radius-md);border:1px solid var(--line);overflow:hidden}
.chip{height:66px}.meta{padding:7px 9px}.n{font-weight:700;font-size:12px}.h{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);margin-top:2px}</style></head><body>
<div class="sw"><div class="chip" style="background:var(--spruce)"></div><div class="meta"><div class="n">Spruce</div><div class="h">#2C4A3B · land</div></div></div>
<div class="sw"><div class="chip" style="background:var(--slate)"></div><div class="meta"><div class="n">Riverslate</div><div class="h">#3D6577 · water</div></div></div>
<div class="sw"><div class="chip" style="background:var(--gold)"></div><div class="meta"><div class="n">Trail Gold</div><div class="h">#B5852B · fill only</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ember)"></div><div class="meta"><div class="n">Ember</div><div class="h">#9A3412 · hazard</div></div></div>
</body></html>
