<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--paper);color:var(--text-primary);padding:22px}
.chart{height:110px;position:relative;border-bottom:1px solid var(--ink-2);border-left:1px solid var(--ink-2)}
.fill{position:absolute;inset:0;background:linear-gradient(90deg,rgba(44,74,59,.18),rgba(44,74,59,.05));clip-path:polygon(0 90%,12% 70%,26% 78%,40% 42%,55% 55%,70% 20%,84% 40%,100% 30%,100% 100%,0 100%)}
.ridge{position:absolute;inset:0;border-top:2px solid var(--spruce);clip-path:polygon(0 90%,12% 70%,26% 78%,40% 42%,55% 55%,70% 20%,84% 40%,100% 30%,100% 31%,84% 41%,70% 21%,55% 56%,40% 43%,26% 79%,12% 71%,0 91%)}
.lab{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:8px}</style></head><body>
<div class="chart"><div class="fill"></div><div class="ridge"></div></div>
<div class="lab"><span>MI 0</span><span>↑ 9,400 FT</span><span>MI 24</span></div>
</body></html>
