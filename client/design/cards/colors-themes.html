<!-- @dsCard group="Colors" viewport="700x160" name="Theme modes" subtitle="Light · dark (dusk) · outdoor high-contrast" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);padding:20px;display:flex;gap:14px;background:#cfc7b6}
.pane{flex:1;border-radius:var(--radius-lg);border:1px solid rgba(0,0,0,.15);padding:14px;display:flex;flex-direction:column;gap:8px}
.t{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.row{display:flex;gap:6px}.d{width:20px;height:20px;border-radius:3px}.btn{font-size:12px;font-weight:700;padding:6px 10px;border-radius:4px;align-self:flex-start}</style></head><body>
<div class="pane" style="background:#F4EFE4;color:#221F1A"><div class="t">Light</div><div class="row"><span class="d" style="background:#FBF9F3;border:1px solid #D9D0BE"></span><span class="d" style="background:#2C4A3B"></span><span class="d" style="background:#3D6577"></span></div><span class="btn" style="background:#DB5A28;color:#fff">Plot a trip</span></div>
<div class="pane" style="background:#17140F;color:#F4EFE4"><div class="t">Dark · dusk</div><div class="row"><span class="d" style="background:#201C16;border:1px solid #3A342A"></span><span class="d" style="background:#6FB495"></span><span class="d" style="background:#6FA6BE"></span></div><span class="btn" style="background:#E4703F;color:#1B1712">Plot a trip</span></div>
<div class="pane" style="background:#000;color:#fff"><div class="t">Outdoor HC</div><div class="row"><span class="d" style="background:#000;border:1px solid #fff"></span><span class="d" style="background:#7BD6A9"></span><span class="d" style="background:#FFCF33"></span></div><span class="btn" style="background:#FF6A34;color:#000">Plot a trip</span></div>
</body></html>
