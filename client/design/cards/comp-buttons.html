<!-- @dsCard group="Components" viewport="700x150" name="Buttons (PlotButton)" subtitle="Primary / secondary / ghost / danger" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--paper);color:var(--text-primary);padding:22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.b{font-weight:700;border-radius:var(--radius-md);border:none;cursor:default;min-height:48px;padding:0 24px;display:inline-flex;align-items:center}
.pri{background:var(--blaze);color:#fff;font-size:16px}
.sec{background:transparent;color:var(--ink);border:1.5px solid var(--ink);font-size:14px;padding:0 20px}
.ghost{background:transparent;color:var(--ink);font-size:14px;padding:0 8px}
.dng{background:var(--ember);color:#fff;font-size:16px}
.dis{background:var(--line);color:var(--ink-3);font-size:16px}</style></head><body>
<button class="b pri">Plot a trip</button>
<button class="b sec">Download offline</button>
<button class="b ghost">Text link&nbsp;<span style="color:var(--blaze)">→</span></button>
<button class="b dng">Discard</button>
<button class="b dis">Disabled</button>
</body></html>
