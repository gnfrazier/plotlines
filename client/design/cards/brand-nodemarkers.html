<!-- @dsCard group="Brand" viewport="700x170" name="Node markers (NodeMarker)" subtitle="Shape + internal mark carries meaning; color reinforces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--paper);color:var(--text-primary);padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.m{display:flex;align-items:center;gap:10px}.n{font-weight:600;font-size:13px}.h{font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}</style></head><body>
<div class="m"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="var(--paper)" stroke="var(--spruce)" stroke-width="2.5"/><circle cx="12" cy="12" r="2.6" fill="var(--spruce)"/></svg><div><div class="n">Waypoint</div><div class="h">ring + dot</div></div></div>
<div class="m"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="var(--paper)" stroke="var(--blaze)" stroke-width="2.5"/><circle cx="12" cy="12" r="4" fill="none" stroke="var(--blaze)" stroke-width="2.5"/></svg><div><div class="n">Regroup</div><div class="h">double ring</div></div></div>
<div class="m"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--slate)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11l7-5 7 5v9"/><path d="M3.5 12L12 5.5 20.5 12"/><path d="M5 20h14"/></svg><div><div class="n">Rest stop</div><div class="h">shelter</div></div></div>
<div class="m"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 4l8.5 15H3.5z" fill="var(--paper)" stroke="var(--ember)" stroke-width="2.3" stroke-linejoin="round"/><path d="M12 10v4.5" stroke="var(--ember)" stroke-width="2.3" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="var(--ember)"/></svg><div><div class="n">Hazard / crux</div><div class="h">warning triangle</div></div></div>
<div class="m"><svg width="26" height="26" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2.5" fill="var(--paper)" stroke="var(--gold)" stroke-width="2.3"/><path d="M8 12h7" stroke="var(--gold)" stroke-width="2.3" stroke-linecap="round"/><path d="M12.5 9l3 3-3 3" fill="none" stroke="var(--gold)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg><div><div class="n">Portage</div><div class="h">square + arrow</div></div></div>
<div class="m"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="var(--ink)"/><path d="M12 8.2l1.1 2.3 2.5.3-1.9 1.7.5 2.5-2.2-1.2-2.2 1.2.5-2.5-1.9-1.7 2.5-.3z" fill="var(--paper)"/></svg><div><div class="n">Plot point</div><div class="h">disc + star</div></div></div>
</body></html>
