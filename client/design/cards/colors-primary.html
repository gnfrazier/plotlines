<!-- @dsCard group="Colors" viewport="700x150" name="Primary — Signal Blaze" subtitle="One primary; ~8% of any view" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--paper);color:var(--text-primary);padding:20px;display:flex;gap:16px;align-items:stretch}
.sw{flex:1;border-radius:var(--radius-md);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.chip{height:66px}.meta{padding:8px 10px}.n{font-weight:700;font-size:14px}.h{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:2px}</style></head><body>
<div class="sw"><div class="chip" style="background:var(--blaze)"></div><div class="meta"><div class="n">Signal Blaze</div><div class="h">#DB5A28 · primary</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ember)"></div><div class="meta"><div class="n">Ember</div><div class="h">#9A3412 · hazard</div></div></div>
</body></html>
