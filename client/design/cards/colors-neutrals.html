<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — Canvas & Ink" subtitle="Warm paper surfaces, warm ink text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--paper);color:var(--text-primary);padding:20px;display:flex;gap:12px}
.sw{flex:1;border-radius:var(--radius-md);border:1px solid var(--line);overflow:hidden}
.chip{height:66px}.meta{padding:7px 9px}.n{font-weight:700;font-size:12px}.h{font-family:var(--font-mono);font-size:10px;color:var(--ink-3);margin-top:2px}</style></head><body>
<div class="sw"><div class="chip" style="background:var(--canvas)"></div><div class="meta"><div class="n">Canvas</div><div class="h">#F4EFE4</div></div></div>
<div class="sw"><div class="chip" style="background:var(--panel)"></div><div class="meta"><div class="n">Panel</div><div class="h">#EBE3D4</div></div></div>
<div class="sw"><div class="chip" style="background:var(--paper)"></div><div class="meta"><div class="n">Paper</div><div class="h">#FBF9F3</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="meta"><div class="n">Ink 60</div><div class="h">#544D42</div></div></div>
<div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="meta"><div class="n">Ink</div><div class="h">#221F1A</div></div></div>
</body></html>
