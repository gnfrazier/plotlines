<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono);background:var(--paper);color:var(--text-primary);padding:14px 22px;font-size:13px}
.row{display:grid;grid-template-columns:60px 28px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}
.mi{color:var(--ink-3)}</style></head><body>
<div class="row"><span class="mi">MI 0.0</span><span style="color:var(--blaze);font-weight:700">R</span><span>Start · Riverside lot</span><span class="mi">PAVED</span></div>
<div class="row"><span class="mi">MI 4.2</span><span style="color:var(--blaze);font-weight:700">L</span><span>CR-204 · gravel begins</span><span style="color:var(--spruce)">GRAVEL</span></div>
<div class="row" style="border:none"><span class="mi">MI 12.4</span><span style="color:var(--slate);font-weight:700">◆</span><span>Regroup · clock tower</span><span style="color:var(--slate)">REST</span></div>
</body></html>
