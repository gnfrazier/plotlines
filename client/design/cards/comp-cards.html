<!-- @dsCard group="Components" viewport="700x170" name="Card + Badge (PlotCard / PlotBadge)" subtitle="Paper surface, hairline border, mono tags" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--canvas);color:var(--text-primary);padding:22px;display:flex;gap:16px}
.card{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px}
.card.raise{box-shadow:var(--elev-2)}
.t{font-weight:700;font-size:16px}.s{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);margin-top:6px}
.badges{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.bg{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.06em;padding:4px 8px;border-radius:3px}
.solid{color:#fff}.tint{background:transparent}</style></head><body>
<div class="card"><div class="t">Flat card</div><div class="s">border does the work</div>
<div class="badges"><span class="bg solid" style="background:var(--spruce)">OFFLINE READY</span><span class="bg tint" style="color:var(--slate);border:1px solid var(--slate)">GRAVEL</span></div></div>
<div class="card raise"><div class="t">Raised card</div><div class="s">soft shadow, sparingly</div>
<div class="badges"><span class="bg solid" style="background:var(--gold);color:var(--ink)">CAUTION</span><span class="bg solid" style="background:var(--ember)">HAZARD</span></div></div>
</body></html>
