<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px rhythm · 44px min touch" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-sans);background:var(--paper);color:var(--text-primary);padding:22px;display:flex;align-items:flex-end;gap:14px}
.c{display:flex;flex-direction:column;align-items:center;gap:6px}.bar{background:var(--spruce);width:100%;border-radius:2px}
.c span{font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}.wrap{display:flex;align-items:flex-end;gap:14px}</style></head><body>
<div class="wrap">
<div class="c" style="width:14px"><div class="bar" style="height:4px"></div><span>4</span></div>
<div class="c" style="width:16px"><div class="bar" style="height:8px"></div><span>8</span></div>
<div class="c" style="width:18px"><div class="bar" style="height:12px"></div><span>12</span></div>
<div class="c" style="width:22px"><div class="bar" style="height:16px"></div><span>16</span></div>
<div class="c" style="width:26px"><div class="bar" style="height:24px"></div><span>24</span></div>
<div class="c" style="width:30px"><div class="bar" style="height:32px"></div><span>32</span></div>
<div class="c" style="width:38px"><div class="bar" style="height:48px"></div><span>48</span></div>
<div class="c" style="width:46px"><div class="bar" style="height:64px"></div><span>64</span></div>
</div>
<div style="margin-left:24px;border:1.5px dashed var(--slate);border-radius:4px;width:64px;height:44px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:var(--slate);text-align:center">44px touch</div>
</body></html>
